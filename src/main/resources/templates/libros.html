<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
		      rel="stylesheet">
        <title>Detalle de libros</title>
    </head>
    <body>
        
        <!-- Page content-->
        <div>
            <div>
                <h1>Añade o edita tus libros favoritos</h1>
            </div>
        </div>
		<table class="table table-striped table-bordered">
		     <tr>
		      	<th scope="col">Titulo</th>
		     	<th scope="col">Autor</th>
		     	<th scope="col">Editorial</th>
		      	<th scope="col">Año Publicación</th>
				<th scope="col">Genero</th>
		      	<th scope="col">Edita o elimina</th>
		    </tr>
		    <tr th:each="libro : ${libros}">
		        <td scope="row" th:text="${libro.titulo}"></td>
		        <td scope="row" th:text="${libro.autor}"></td>
		        <td scope="row" th:text="${libro.editorial}"></td>
		        <td scope="row" th:text="${libro.anoPublicacion}"></td>
				<td scope="row" th:text="${libro.genero != null ? libro.genero.genero : 'Sin género'}"></td>				
		        <td class="actions"><a th:href="@{/libros/edit/{id}(id=${libro.id})}">Editar</a>   						
					<form th:action="@{/libros/delete/{id}(id=${libro.id})}"
					      method="post"
					      onsubmit="return confirm('¿Deseas borrar este libro?');">
					    <button type="submit" class="btn btn-danger">Borrar</button>
					</form>  						
				</td>
			</tr>    
		</table>

		<div>
			<a th:href="@{/libros/new}">Añade un libro</a>
		<div/>
		<div>
			<a th:href="@{/genero}">Gestionar géneros</a>
		<div/>
		<div>
			<a th:href="@{/}">Volver al inicio</a>
		<div/>
    </body>
</html>
