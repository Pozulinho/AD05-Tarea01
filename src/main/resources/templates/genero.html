<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
		      rel="stylesheet">
        <title>Generos disponibles</title>
    </head>
    <body>
		<h1>Generos disponibles</h1>
		<table class="table table-striped table-bordered">
		     <tr>
		      	<th scope="col">Genero</th>
				<th scope="col">Numero de libros</th>				
		      	<th scope="col">Edita o elimina</th>
		    </tr>
		    <tr th:each="genero : ${generos}">
		        <td scope="row" th:text="${genero.genero}"></td>
				<td scope="row" th:text="${#lists.size(genero.libros)}"></td>				
		        <td><a th:href="@{/genero/edit/{id}(id=${genero.id})}">Editar</a>   						
					<form th:action="@{/genero/delete/{id}(id=${genero.id})}"
					      method="post"
					      onsubmit="return confirm('Si borras este género, también se eliminarán todos sus libros. ¿Deseas continuar?');">
					    <button type="submit" class="btn btn-danger">Borrar</button>
					</form>
									</td>
		    </tr>    
		</table>
		<div>
			<a th:href="@{/genero/new}">Añadir un genero nuevo</a>
		<div/>
		<div>
			<a th:href="@{/libros}">Gestionar libros</a>
		<div/>
		<div>
			<a th:href="@{/}">Volver al inicio</a>
		<div/>
		<br/>  
		</body>
</html>
