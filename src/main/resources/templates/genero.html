<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>Generos disponibles</title>
    </head>
    <body>
		<h1>Generos disponibles</h1>
		<table>
		     <tr>
		      	<th scope="col">Genero</th>
				<th scope="col">Numero de libros</th>				
		      	<th scope="col">Acciones</th>
		    </tr>
		    <tr th:each="genero : ${generos}">
		        <td scope="row" th:text="${genero.genero}"></td>
				<td scope="row" th:text="${#lists.size(genero.libros)}"></td>				
		        <td><a th:href="@{/genero/edit/{id}(id=${genero.id})}">Editar</a>   						
									<a th:href="@{/genero/delete/{id}(id=${genero.id})}"
									onclick="return confirm('¿Estás seguro? Si borras este género, también se eliminarán todos los libros asociados a él.');">Borrar</a>
									</td>
		    </tr>    
		</table>
		<a th:href="@{/genero/new}" class="btn btn-success">Añadir un genero nuevo</a>
		<br/>  
		</body>
</html>
