<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>Genero</title>
    </head>
    <body>
		<h1>Generos disponibles</h1>
		<table class="table table-striped">
		     <tr>
		      	<th scope="col">Genero</th>
		      	<th scope="col">Acciones</th>
		    </tr>
		    <tr th:each="genero : ${generos}">
		        <td scope="row" th:text="${generos.nombre}"></td>
		        <td class="actions"><a th:href="@{/genero/edit/{id}(id=${generos.id})}" class="btn btn-primary">Editar</a>   						
									<a th:href="@{/genero/delete/{id}(id=${generos.id})}" class="btn btn-danger">Borrar</a>
									</td>
		    </tr>    
		</table>
		<a th:href="@{/genero/new}" class="btn btn-success">Añadir un genero nuevo</a>
		<br/>  
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
		</body>
</html>
