<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Añadir libro</title>
</head>
<body>

<form method="post" action="#"th:action="@{/libros/new/submit}" th:object="${libro}">
<h1>
	 <span th:text="${id} ? 'Edit' : 'New'"></span> Nuevo libro
</h1>
  
  <input type="hidden" th:field="*{id}" id="id" />
  <div>
	<label for="tituloInput">Titulo</label>
	<input type="text"	placeholder="Titulo" th:field="*{titulo}"></input>
  </div>				
   <div>
    <label for="autorInput">Autor</label>
    <input type="text" placeholder="Autor" th:field="*{autor}">
  </div>
  <div>
    <label for="editorialInput">Editorial</label>
    <input type="text" placeholder="Editorial" th:field="*{editorial}">
  </div>
    <div>
    <label for="anoPublicacionInput">Año de Publicación</label>
    <input type="number" placeholder="Publicación" th:field="*{anoPublicacion}">
  </div>
    <div>
    <label for="genero">Genero</label>
    <select
							th:field="*{genero}">
							<option value="-1">---</option>
							<option th:each="genero : ${generos}"
								th:value="${genero.id}" th:text="${genero.genero}">Genero</option>
						</select>
  </div>
  <button type="submit">Enviar</button>
</form>

<br/>  
</body>
</html>
