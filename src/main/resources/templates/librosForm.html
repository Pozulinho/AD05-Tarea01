<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	      rel="stylesheet">
    <title>Añadir o editar libro</title>
</head>
<body>

	<p th:if="${mensaje != null}"
	   th:text="${mensaje}">
	</p>
	
<form th:if="${generos != null and !generos.isEmpty()}" method="post" action="#" th:action="@{/libros/new/submit}" th:object="${libro}">
<h1>
	 <span th:text="*{id} ? 'Edita el ' : 'Nuevo '"></span> libro
</h1>
  
  <input type="hidden" th:field="*{id}" id="id" />
  <div>
	<label for="tituloInput">Titulo</label>
	<input type="text"	placeholder="Titulo" th:field="*{titulo}"></input>
  </div>				
   <div>
    <label for="autorInput">Autor</label>
    <input type="text" placeholder="Autor" th:field="*{autor}">
  </div>
  <div>
    <label for="editorialInput">Editorial</label>
    <input type="text" placeholder="Editorial" th:field="*{editorial}">
  </div>
    <div>
    <label for="anoPublicacionInput">Año de Publicación</label>
    <input type="number" placeholder="Publicación" th:field="*{anoPublicacion}">
  </div>
    <div>
    <label for="generoSeleccionado">Genero</label>
	<select id="generoSeleccionado" th:field="*{genero}" class="form-select" required>
	    <option value="">Selecciona un género</option>

	    <option th:each="genero : ${generos}"
	            th:value="${genero.id}"
	            th:text="${genero.genero}"
	            th:selected="${libro.genero != null
	                and genero.id == libro.genero.id}">
	    </option>
	</select>
  </div>
  <button type="submit" class="btn btn-danger">Enviar</button>
</form>

<br/>  
</body>
</html>
